services:
  mongodb:
    image: mongo:8
    container_name: setu-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - setu_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  setu_mongodb_data:
